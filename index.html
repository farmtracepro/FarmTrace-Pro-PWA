<script>
// FarmTrace Pro GitHub Pages configuration.
// Leave API_URL empty when this page is served directly by Google Apps Script.
// For GitHub Pages, set API_URL to the deployed Apps Script Web App /exec URL.
const API_URL = '';
const RUNNING_IN_APPS_SCRIPT = typeof google !== 'undefined' && google.script && google.script.run;

function apiUrl(action, params={}){
  if(!API_URL) throw new Error('API_URL belum ditetapkan untuk GitHub Pages.');
  const u = new URL(API_URL);
  u.searchParams.set('api', action);
  Object.entries(params).forEach(([k,v])=>{
    if(v !== undefined && v !== null && v !== '') u.searchParams.set(k, v);
  });
  return u.toString();
}

async function apiGet(action, params={}){
  const res = await fetch(apiUrl(action, params), {
    method:'GET',
    headers:{'Accept':'application/json'}
  });
  if(!res.ok) throw new Error('API GET gagal: HTTP ' + res.status);
  const data = await res.json();
  if(data && data.ok === false) throw new Error(data.error || 'API request failed');
  return (data && Object.prototype.hasOwnProperty.call(data, 'data')) ? data.data : data;
}

async function apiPost(payload){
  if(!API_URL) throw new Error('API_URL belum ditetapkan untuk GitHub Pages.');
  const res = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8','Accept':'application/json'},
    body:JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('API POST gagal: HTTP ' + res.status);
  const data = await res.json();
  if(!data || data.ok !== true) throw new Error((data && data.error) || 'Server tidak mengesahkan rekod.');
  return data;
}


let lang='ms';

let selectedFiles=[];

const $=id=>document.getElementById(id);

const DB_NAME='FarmTraceProDemoV1';

const STORE='pending_records';


function openDB(){

  return new Promise((resolve,reject)=>{

    const req=indexedDB.open(DB_NAME,1);


    req.onupgradeneeded=e=>{

      const d=e.target.result;

      if(!d.objectStoreNames.contains(STORE)){

        d.createObjectStore(
          STORE,
          {keyPath:'syncId'}
        );

      }

    };


    req.onsuccess=e=>{

      const d=e.target.result;

      d.onversionchange=()=>{

        try{

          d.close();

        }catch(_){}

      };

      resolve(d);

    };


    req.onerror=e=>

      reject(
        e.target.error ||
        new Error('IndexedDB open failed')
      );

  });

}


async function dbPut(record){

  const d=await openDB();

  return new Promise((resolve,reject)=>{

    let tx;

    try{

      tx=d.transaction(
        STORE,
        'readwrite'
      );

      tx.objectStore(STORE)
        .put(record);

    }catch(err){

      try{
        d.close();
      }catch(_){}

      reject(err);

      return;
    }


    tx.oncomplete=()=>{

      try{
        d.close();
      }catch(_){}

      resolve();

    };


    tx.onerror=()=>{

      const err=
        tx.error ||
        new Error('Offline save failed');

      try{
        d.close();
      }catch(_){}

      reject(err);

    };

  });

}


async function dbGetAll(){

  const d=await openDB();

  return new Promise((resolve,reject)=>{

    let tx,req;

    try{

      tx=d.transaction(
        STORE,
        'readonly'
      );

      req=
        tx.objectStore(STORE)
        .getAll();

    }catch(err){

      try{
        d.close();
      }catch(_){}

      reject(err);

      return;

    }


    req.onsuccess=()=>{

      resolve(
        req.result || []
      );

    };


    req.onerror=()=>{

      reject(
        req.error ||
        new Error(
          'Cannot read offline records'
        )
      );

    };


    tx.oncomplete=()=>{

      try{
        d.close();
      }catch(_){}

    };

  });

}


async function dbDelete(id){

  const d=await openDB();

  return new Promise((resolve,reject)=>{

    let tx;

    try{

      tx=d.transaction(
        STORE,
        'readwrite'
      );

      tx.objectStore(STORE)
        .delete(id);

    }catch(err){

      try{
        d.close();
      }catch(_){}

      reject(err);

      return;

    }


    tx.oncomplete=()=>{

      try{
        d.close();
      }catch(_){}

      resolve();

    };


    tx.onerror=()=>{

      const err=
        tx.error ||
        new Error(
          'Cannot delete offline record'
        );

      try{
        d.close();
      }catch(_){}

      reject(err);

    };

  });

}


document.addEventListener(
  'DOMContentLoaded',
  async()=>{

    setLang('ms');

    updateNetwork();


    window.addEventListener(
      'online',
      ()=>{

        updateNetwork();

        syncAll();

      }
    );


    window.addEventListener(
      'offline',
      updateNetwork
    );


    loadActiveClients().catch(err => {
      console.error('Client load error:', err);
      $('saveStatus').textContent = '⚠️ ' + (err.message || err);
    });


    try{

      await updatePendingCount();

    }catch(err){

      $('pendingBadge')
        .textContent=
        'Offline Storage Error';

    }

  }
);

function loadActiveClients(){
  if(RUNNING_IN_APPS_SCRIPT){
    return new Promise((resolve,reject)=>{
      google.script.run
        .withSuccessHandler(clients=>{
          populateClients(clients || []);
          resolve(clients || []);
        })
        .withFailureHandler(reject)
        .getActiveClients();
    });
  }
  return apiGet('getActiveClients').then(clients=>{
    populateClients(clients || []);
    return clients || [];
  });
}

function populateClients(clients){
  const clientSelect = $('clientSelect');
  clientSelect.innerHTML = '<option value="">-- Pilih / Select --</option>';
  clients.forEach(client=>{
    const option=document.createElement('option');
    option.value=client.clientId;
    option.textContent=client.companyName;
    clientSelect.appendChild(option);
  });
}

function loadCentresByClient() {
  const clientId = $('clientSelect').value;
  const centreSelect = $('weighingCentre');

  centreSelect.innerHTML = '<option value="">-- Pilih / Select --</option>';
  if (!clientId) return;

  const handle = list => {
    (list || []).forEach(name => {
      const option=document.createElement('option');
      option.value=name;
      option.textContent=name;
      centreSelect.appendChild(option);
    });
  };

  if(RUNNING_IN_APPS_SCRIPT){
    google.script.run
      .withSuccessHandler(handle)
      .withFailureHandler(err=>console.error('Centre load error:', err))
      .getWeighingCentres(clientId);
  }else{
    apiGet('getWeighingCentres',{clientId})
      .then(handle)
      .catch(err=>console.error('Centre load error:', err));
  }
}

function getGPS(){

  $('gpsStatus')
    .textContent=
    lang==='ms'
      ? '📡 Sedang mendapatkan lokasi GPS...'
      : '📡 Getting GPS location...';


  if(
    !navigator.geolocation
  ){

    $('gpsStatus')
      .textContent=
      '❌ Geolocation unavailable';

    return;

  }


  navigator.geolocation
    .getCurrentPosition(

      p=>{

        const lat=
          p.coords.latitude
          .toFixed(7);

        const lng=
          p.coords.longitude
          .toFixed(7);

        const acc=
          Math.round(
            p.coords.accuracy || 0
          );


        $('latitude').value=lat;

        $('longitude').value=lng;

        $('gpsAccuracy').value=acc;


        $('mapPreview').value=

          'https://www.google.com/maps/search/?api=1&query='
          + lat
          + ','
          + lng;


        $('gpsStatus')
          .textContent=

          (lang==='ms'
            ? '✅ GPS berjaya. Ketepatan ±'
            : '✅ GPS acquired. Accuracy ±')

          + acc
          + ' m';

      },


      e=>

        $('gpsStatus')
          .textContent=
          '❌ GPS: '
          + e.message,


      {

        enableHighAccuracy:true,

        timeout:30000,

        maximumAge:0

      }

    );

}


function openMap(){

function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();


      reader.onload=()=>{

        const img=
          new Image();


        img.onload=()=>{

          let w=
            img.width;

          let h=
            img.height;

          const max=1600;


          if(
            w>max ||
            h>max
          ){

            const ratio=
              Math.min(
                max/w,
                max/h
              );

            w=
              Math.round(
                w*ratio
              );

            h=
              Math.round(
                h*ratio
              );

          }


          const canvas=
            document.createElement(
              'canvas'
            );

          canvas.width=w;

          canvas.height=h;


          canvas
            .getContext('2d')
            .drawImage(
              img,
              0,
              0,
              w,
              h
            );


          const dataUrl=
            canvas.toDataURL(
              'image/jpeg',
              0.72
            );


          resolve({

            mimeType:
              'image/jpeg',

            data:
              dataUrl
              .split(',')[1]

          });

        };


        img.onerror=
          reject;


        img.src=
          reader.result;

      };


      reader.onerror=
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


function makeSyncId(){

  return (
    'FTP-SYNC-'
    + Date.now()
    + '-'
    + Math.random()
      .toString(36)
      .slice(2,10)
  );

}

  for(
    const file of selectedFiles
  ){

    photos.push(
      await compressImage(file)
    );

  }


  return {

    syncId:
      makeSyncId(),

    createdAt:

      .toISOString(),
clientId:
  $('clientSelect').value,

      $('longitude').value,

    gpsAccuracy:
      $('gpsAccuracy').value,

    sensitiveAreas:
      Array.from(
        document
          .querySelectorAll(
            'input[name=sensitive]:checked'
          )
      )
      .map(
        x=>x.value
      ),

    sensitiveOther:
      $('sensitiveOther')
      .value
      .trim(),

    photos:photos,

    officerName:
      $('officerName')
      .value
      .trim(),

    status:
      $('status').value,

    notes:
      $('notes')
      .value
      .trim()

  };

}


function resetFormKeepOfficerCentre(){
const client=
  $('clientSelect').value;
  const centre=
    $('weighingCentre').value;

  const officer=
    $('officerName').value;


  $('farmForm').reset();
$('clientSelect')
  .value=
  client;

  $('weighingCentre')
    .value=
    centre;

  $('officerName')
    .value=
    officer;


  selectedFiles=[];


  $('photoCount')
    .textContent=
    '0 / 4';


  $('gpsStatus')
    .textContent='';


  toggleOther();

}


function newRecord(){

  resetFormKeepOfficerCentre();

  $('saveStatus')
    .textContent='';

  window.scrollTo({

    top:0,

    behavior:'smooth'

  });

}


$('farmForm')
.addEventListener(
  'submit',
  async e=>{

    e.preventDefault();


    if(
      !$('weighingCentre').value
    ){

      alert(
        lang==='ms'
          ? 'Sila pilih Pusat Timbang.'
          : 'Please select a Weighing Centre.'
      );

      return;

    }


    if(
      !$('farmerName')
        .value
        .trim()

      ||

      !$('farmArea')
        .value
        .trim()
    ){

      alert(
        lang==='ms'
          ? 'Nama Pekebun dan Keluasan wajib diisi.'
          : 'Smallholder Name and Farm Area are required.'
      );

      return;

    }


    $('saveStatus')
      .textContent=

      lang==='ms'
        ? '⏳ Menyimpan dalam telefon...'
        : '⏳ Saving to phone...';


    try{

      const payload=
        await collectPayload();


      await dbPut(
        payload
      );


      await updatePendingCount();


      resetFormKeepOfficerCentre();


      $('saveStatus')
        .textContent=

        lang==='ms'
          ? '✅ Rekod disimpan dalam telefon.'
          : '✅ Record saved on phone.';


      if(
        navigator.onLine
      ){

        syncOne(
          payload.syncId
        );

      }

    }catch(err){

      $('saveStatus')
        .textContent=
        '❌ '
        + err.message;

    }

  }
);


function sendToServer(payload){
  if(RUNNING_IN_APPS_SCRIPT){
    return new Promise((resolve,reject)=>{
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .submitFarmVerification(payload);
    });
  }
  return apiPost(payload);
}


async function syncOne(syncId){

  const all=
    await dbGetAll();

  const payload=
    all.find(
      x=>x.syncId===syncId
    );


  if(
    !payload
  ) return;


  try{

    const result=
      await sendToServer(
        payload
      );


    if(
      result &&
      result.ok
    ){

      await dbDelete(
        syncId
      );


      await updatePendingCount();


      $('saveStatus')
        .textContent=

        '✅ Synced: '
        + result.recordId
        + ' — '
        + result.centre;

    }

  }catch(err){

    $('saveStatus')
      .textContent=

      (
        lang==='ms'
          ? '⚠️ Rekod kekal Pending. Sync gagal: '
          : '⚠️ Record remains Pending. Sync failed: '
      )

      + (
        err.message ||
        err
      );

  }

}


async function syncAll(){

  if(
    !navigator.onLine
  ){

    $('saveStatus')
      .textContent=

      lang==='ms'
        ? '🔴 Tiada internet. Rekod kekal Pending.'
        : '🔴 No internet. Records remain Pending.';

    return;

  }


  const all=
    await dbGetAll();


  if(
    !all.length
  ){

    $('saveStatus')
      .textContent=

      lang==='ms'
        ? '✅ Tiada rekod Pending.'
        : '✅ No Pending records.';

    return;

  }


  $('saveStatus')
    .textContent=

    '🔄 Sync '
    + all.length
    + '...';


  let success=0;


  for(
    const payload of all
  ){

    try{

      const result=
        await sendToServer(
          payload
        );


      if(
        result &&
        result.ok
      ){

        await dbDelete(
          payload.syncId
        );

        success++;

      }

    }catch(err){}

  }


  await updatePendingCount();


  $('saveStatus')
    .textContent=

    '✅ Synced '
    + success
    + ' / '
    + all.length;


  if(
    !$('pendingSection')
      .classList
      .contains('hidden')
  ){

    showPending();

  }

}


async function showPending(){

  $('pendingSection')
    .classList
    .remove('hidden');


  const list=
    $('pendingList');


  list.innerHTML='';


  const all=
    await dbGetAll();


  if(
    !all.length
  ){

    list.textContent=

      lang==='ms'
        ? 'Tiada rekod Pending.'
        : 'No Pending records.';

    return;

  }


  all
    .sort(
      (a,b)=>
        a.createdAt
        .localeCompare(
          b.createdAt
        )
    )

    .forEach(p=>{

      const card=
        document.createElement(
          'div'
        );

      card.className=
        'pending-card';


      const title=
        document.createElement(
          'b'
        );

      title.textContent=
        p.farmerName || '';


      const centre=
        document.createElement(
          'div'
        );

      centre.textContent=
        p.weighingCentre || '';


      const time=
        document.createElement(
          'div'
        );

      time.className=
        'small';

      time.textContent=
        new Date(
          p.createdAt
        )
        .toLocaleString();


      const actions=
        document.createElement(
          'div'
        );

      actions.className=
        'actions';


      const syncBtn=
        document.createElement(
          'button'
        );

      syncBtn.type=
        'button';

      syncBtn.className=
        'secondary';

      syncBtn.textContent=
        'Sync';

      syncBtn.onclick=
        ()=>syncOne(
          p.syncId
        );


      const deleteBtn=
        document.createElement(
          'button'
        );

      deleteBtn.type=
        'button';

      deleteBtn.className=
        'danger';

      deleteBtn.textContent=
        'Delete';

      deleteBtn.onclick=
        ()=>deletePending(
          p.syncId
        );


      actions.appendChild(
        syncBtn
      );

      actions.appendChild(
        deleteBtn
      );


      card.appendChild(
        title
      );

      card.appendChild(
        document.createElement(
          'br'
        )
      );

      card.appendChild(
        centre
      );

      card.appendChild(
        time
      );

      card.appendChild(
        actions
      );


      list.appendChild(
        card
      );

    });

}


async function deletePending(id){

  if(
    confirm(
      lang==='ms'
        ? 'Padam rekod Pending ini?'
        : 'Delete this Pending record?'
    )
  ){

    await dbDelete(
      id
    );

    await updatePendingCount();

    showPending();

  }

}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.warn('Service worker registration failed:', err));
  });
}
